<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Configurable Modular Helicopter Login</title>
</head>

<style>
    /* ================= GLOBAL CONFIGURATION VARIABLES ================= */
    :root {
        /* 1. Core Component Palette */
        --hel-color-primary: #1e293b;       /* Airframe, Fuselage, Skids & Heavy Hardware */
        --hel-color-secondary: #f59e0b;     /* Warning Tips, Rungs, Rivets, Caps & Beacons */
        --hel-color-background: #090d16;    /* Dark Outlines, Blade Spars, Hub Core & Shadows */
        --hel-color-foreground: #38bdf8;    /* Cockpit Glass, Primary Action & High-Vis Glow */
        --hel-color-canvas: #ffffff;        /* Billboard Form Sheet Background */

        /* 2. Form Interface Elements */
        --hel-color-text: #0f172a;          /* Headings & Field Input Values */
        --hel-color-muted: #475569;         /* Field Labels & Secondary Text */
        --hel-color-border: #cbd5e1;        /* Field Inset Borders */

        /* 3. Mission Status & Feedback States */
        --hel-color-success: #10b981;       /* Authentication Glow & Departure State */
        --hel-color-danger: #ef4444;        /* Crash Alarm Strobe, Smoke & Failure State */
        --hel-color-danger-bg: #fee2e2;     /* Failure Button Background */
        --hel-color-danger-border: #f87171; /* Failure Button Dashed Border */

        /* 4. Ambient Environment / Sky */
        --hel-sky-top: #38bdf8;
        --hel-sky-mid: #bae6fd;
        --hel-sky-bot: #e0f2fe;

        /* 5. Rotor & Wave Motion Speeds */
        --hel-speed: 1;
        --hel-rotor-main-speed: calc(0.42s / var(--hel-speed));
        --hel-rotor-tail-speed: calc(0.22s / var(--hel-speed));
        --hel-sine-wave-speed: calc(3s / var(--hel-speed));
    }

    /* ================= BASE RESET & MOBILE VIEWPORT LOCK ================= */
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        inset: 0;
        text-size-adjust: 100%;
        touch-action: manipulation;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(180deg, var(--hel-sky-top) 0%, var(--hel-sky-mid) 60%, var(--hel-sky-bot) 100%);
    }

    /* Ambient Clouds */
    .sky-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
    }
    .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 50px;
        filter: blur(8px);
    }
    .cloud-1 { width: 320px; height: 80px; top: 8%; left: 5%; opacity: 0.8; }
    .cloud-2 { width: 440px; height: 100px; top: 35%; right: -5%; opacity: 0.6; }
    .cloud-3 { width: 260px; height: 70px; bottom: 10%; left: 10%; opacity: 0.7; }

    /* Pure CSS State Radios */
    input[type="radio"].state-toggle {
        display: none;
    }

    /* Viewport Stage */
    .stage-viewport {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        pointer-events: none;
    }

    /* Master Flight Animations */
    @keyframes flyInFromRight {
        0%   { transform: translate(160vw, -30px) rotate(-10deg); }
        65%  { transform: translate(-25px, 15px) rotate(6deg); }
        85%  { transform: translate(6px, -5px) rotate(-1.5deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes flyOutToLeft {
        0%   { transform: translate(0, 0) rotate(0deg); }
        20%  { transform: translate(25px, -15px) rotate(4deg); }
        100% { transform: translate(-170vw, -70px) rotate(-16deg); }
    }
    @keyframes chopperCrash {
        0%   { transform: translate(0, 0) rotate(0deg); }
        15%  { transform: translate(10px, -20px) rotate(-18deg); }
        30%  { transform: translate(-25px, 40px) rotate(65deg); }
        60%  { transform: translate(30px, 180px) rotate(260deg); }
        85%  { transform: translate(-20px, 420px) rotate(520deg); }
        100% { transform: translate(15px, 130vh) rotate(780deg); }
    }
    @keyframes hoverSway {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50%      { transform: translateY(-6px) rotate(-0.5deg); }
    }

    /* Master Container */
    .container {
        width: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        transform-origin: center center;
        pointer-events: auto;
    }

    .container-hover-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Responsive Scaling */
    @media (max-width: 480px) {
        .container { transform: scale(0.85); }
    }
    @media (max-height: 700px) {
        .container { transform: scale(0.8); }
    }
    @media (max-height: 580px) {
        .container { transform: scale(0.68); }
    }
    @media (max-height: 480px) {
        .container { transform: scale(0.55); }
    }

    /* State Switch Actions */
    #state-flyin:checked ~ .stage-viewport .container {
        animation: flyInFromRight calc(2.8s / var(--hel-speed)) cubic-bezier(0.25, 0.9, 0.3, 1) forwards;
    }
    #state-flyin:checked ~ .stage-viewport .container .container-hover-wrapper {
        animation: hoverSway calc(3s / var(--hel-speed)) ease-in-out infinite calc(2.8s / var(--hel-speed));
    }

    #state-success:checked ~ .stage-viewport .container {
        animation: flyOutToLeft calc(2.2s / var(--hel-speed)) cubic-bezier(0.55, 0.05, 0.3, 1) forwards !important;
    }

    #state-fail:checked ~ .stage-viewport .container {
        animation: chopperCrash calc(2.8s / var(--hel-speed)) cubic-bezier(0.35, 0, 0.65, 1) forwards !important;
    }
</style>

<body>

    <!-- State Radios -->
    <input type="radio" name="sim-state" id="state-flyin" class="state-toggle" checked autocomplete="off">
    <input type="radio" name="sim-state" id="state-success" class="state-toggle" autocomplete="off">
    <input type="radio" name="sim-state" id="state-fail" class="state-toggle" autocomplete="off">

    <!-- Sky Backdrop -->
    <div class="sky-bg">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <!-- ================= 0. NAVBAR SECTION ================= -->
    <style>
        .navbar-section {
            position: fixed;
            top: 12px;
            top: calc(12px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            margin-left: auto;
            margin-right: auto;
            width: fit-content;
            max-width: calc(100vw - 24px);

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            padding: 5px 8px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 999999;
            touch-action: manipulation;
        }

        .navbar-section .nav-btn {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            border-radius: 999px;
            cursor: pointer;
            color: #94a3b8;
            white-space: nowrap;
            transition: all 0.2s ease;
            user-select: none;
        }

        .navbar-section .nav-btn:hover {
            color: var(--hel-color-canvas);
        }

        #state-flyin:checked ~ .navbar-section label[for="state-flyin"] {
            background: var(--hel-color-foreground);
            color: var(--hel-color-background);
        }

        #state-success:checked ~ .navbar-section label[for="state-success"] {
            background: var(--hel-color-success);
            color: var(--hel-color-canvas);
            box-shadow: 0 0 10px var(--hel-color-success);
        }

        #state-fail:checked ~ .navbar-section label[for="state-fail"] {
            background: var(--hel-color-danger);
            color: var(--hel-color-canvas);
            box-shadow: 0 0 10px var(--hel-color-danger);
        }

        @media (max-width: 420px) {
            .navbar-section {
                padding: 4px 6px;
                gap: 4px;
            }
            .navbar-section .nav-btn {
                font-size: 10.5px;
                padding: 6px 10px;
            }
            .navbar-section .nav-btn .detail-text {
                display: none;
            }
        }
    </style>

    <nav class="navbar-section">
        <label for="state-flyin" class="nav-btn">🔄 Reset</label>
        <label for="state-success" class="nav-btn">✅ Success<span class="detail-text"> (Fly Left)</span></label>
        <label for="state-fail" class="nav-btn">💥 Fail<span class="detail-text"> (Crash)</span></label>
    </nav>

    <!-- ================= STAGE VIEWPORT ================= -->
    <div class="stage-viewport">
        <div class="container">
            <div class="container-hover-wrapper">

                <!-- 1. HELICOPTER STYLE -->
                <style>
                    .helecopter-section {
                        width: 320px;
                        height: 120px;
                        position: relative;
                        display: block;
                        margin: 0;
                        padding: 0;
                        line-height: 0;
                        overflow: visible;
                    }

                    .helecopter-section .chopper-svg {
                        width: 320px;
                        height: 120px;
                        display: block;
                        overflow: visible;
                    }

                    @keyframes spinBlade {
                        from { transform: rotate(0deg); }
                        to   { transform: rotate(360deg); }
                    }

                    .helecopter-section .main-blade-spin {
                        animation: spinBlade var(--hel-rotor-main-speed) linear infinite;
                        transform-box: fill-box;
                        transform-origin: center;
                    }

                    .helecopter-section .tail-blade-spin {
                        animation: spinBlade var(--hel-rotor-tail-speed) linear infinite;
                        transform-box: fill-box;
                        transform-origin: center;
                    }

                    @keyframes billowSmoke {
                        0%   { opacity: 0; transform: translate(0, 0) scale(0.3); }
                        50%  { opacity: 0.9; }
                        100% { opacity: 0; transform: translate(-60px, -120px) scale(3.5); }
                    }

                    .helecopter-section .smoke-puff {
                        position: absolute;
                        top: 25px;
                        left: 195px;
                        width: 22px;
                        height: 22px;
                        border-radius: 50%;
                        background: radial-gradient(circle, var(--hel-color-muted) 0%, rgba(30,41,59,0) 80%);
                        opacity: 0;
                        pointer-events: none;
                    }

                    #state-fail:checked ~ .stage-viewport .smoke-1 { animation: billowSmoke 0.9s ease-out infinite; }
                    #state-fail:checked ~ .stage-viewport .smoke-2 { animation: billowSmoke 0.9s ease-out infinite 0.3s; }
                    #state-fail:checked ~ .stage-viewport .smoke-3 { animation: billowSmoke 0.9s ease-out infinite 0.6s; }
                    #state-fail:checked ~ .stage-viewport .main-blade-spin { animation-duration: 0.9s; }
                    #state-fail:checked ~ .stage-viewport .strobe-beacon { 
                        fill: var(--hel-color-danger) !important; 
                        filter: drop-shadow(0 0 8px var(--hel-color-danger)); 
                    }
                </style>

                <!-- 1. HELICOPTER SECTION -->
                <section class="helecopter-section">
                    <div class="smoke-puff smoke-1"></div>
                    <div class="smoke-puff smoke-2"></div>
                    <div class="smoke-puff smoke-3"></div>

                    <svg class="chopper-svg" viewBox="0 0 320 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="fuselage" x1="120" y1="40" x2="160" y2="105" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="var(--hel-color-primary)" />
                                <stop offset="100%" stop-color="var(--hel-color-background)" />
                            </linearGradient>
                            <linearGradient id="windshield" x1="110" y1="50" x2="155" y2="90" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="var(--hel-color-foreground)" stop-opacity="0.9" />
                                <stop offset="100%" stop-color="var(--hel-color-background)" />
                            </linearGradient>
                        </defs>

                        <!-- Far Skid (Back Leg) -->
                        <g opacity="0.65">
                            <path d="M140 92 L132 110" stroke="var(--hel-color-primary)" stroke-width="3.5" stroke-linecap="round"/>
                            <path d="M185 90 L177 110" stroke="var(--hel-color-primary)" stroke-width="3.5" stroke-linecap="round"/>
                            <path d="M105 106 Q 112 110, 120 110 L 210 110" stroke="var(--hel-color-primary)" stroke-width="4" stroke-linecap="round"/>
                        </g>

                        <!-- Tail Boom & Fin -->
                        <path d="M195 68 L282 52 L282 60 L190 82 Z" fill="var(--hel-color-primary)" stroke="var(--hel-color-background)" stroke-width="1.2"/>
                        <path d="M250 58 L272 60 L270 64 L248 61 Z" fill="var(--hel-color-primary)"/>
                        <path d="M280 58 L294 22 L304 22 L290 64 L282 62 Z" fill="var(--hel-color-primary)" stroke="var(--hel-color-background)" stroke-width="1"/>

                        <!-- Flat Flower Tail Rotor -->
                        <g transform="translate(296, 30)">
                            <circle cx="0" cy="0" r="15" fill="var(--hel-color-background)" opacity="0.2"/>
                            
                            <g class="tail-blade-spin">
                                <line x1="-15" y1="0" x2="15" y2="0" stroke="var(--hel-color-background)" stroke-width="3.2" stroke-linecap="round"/>
                                <line x1="0" y1="-15" x2="0" y2="15" stroke="var(--hel-color-background)" stroke-width="3.2" stroke-linecap="round"/>
                                
                                <circle cx="-13" cy="0" r="1.8" fill="var(--hel-color-secondary)"/>
                                <circle cx="13" cy="0" r="1.8" fill="var(--hel-color-secondary)"/>
                                <circle cx="0" cy="-13" r="1.8" fill="var(--hel-color-secondary)"/>
                                <circle cx="0" cy="13" r="1.8" fill="var(--hel-color-secondary)"/>
                            </g>

                            <circle cx="0" cy="0" r="3.6" fill="var(--hel-color-primary)"/>
                            <circle cx="0" cy="0" r="1.8" fill="var(--hel-color-foreground)"/>
                        </g>

                        <!-- Fuselage Body -->
                        <path d="M102 82 C 98 68, 108 55, 128 50 C 146 45, 172 45, 196 54 C 202 56, 206 63, 198 79 C 192 94, 174 103, 142 103 C 116 103, 104 92, 102 82 Z" 
                          fill="url(#fuselage)" stroke="var(--hel-color-background)" stroke-width="1.5"/>

                        <!-- Engine Doghouse -->
                        <path d="M150 48 C 154 40, 172 38, 190 45 C 198 48, 200 53, 192 56 Z" fill="var(--hel-color-primary)"/>
                        <ellipse cx="192" cy="52" rx="4" ry="2.5" fill="var(--hel-color-background)" stroke="var(--hel-color-secondary)" stroke-width="1"/>

                        <!-- Cockpit -->
                        <path d="M106 80 C 103 69, 112 56, 128 52 C 146 48, 162 50, 167 60 C 170 67, 169 79, 158 86 C 145 92, 117 92, 107 86 Z" 
                          fill="url(#windshield)" stroke="var(--hel-color-background)" stroke-width="1.2"/>
                        <path d="M135 52 C 136 65, 135 76, 132 89" stroke="var(--hel-color-primary)" stroke-width="2"/>

                        <!-- Foreground Skid (Front Leg - Matches back leg) -->
                        <path d="M132 94 L120 119" stroke="var(--hel-color-primary)" stroke-width="4.5" stroke-linecap="round"/>
                        <path d="M174 93 L200 119" stroke="var(--hel-color-primary)" stroke-width="4.5" stroke-linecap="round"/>
                        <path d="M92 113 Q 102 119, 115 119 L 225 119" stroke="var(--hel-color-primary)" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="92" cy="113" r="2.5" fill="var(--hel-color-background)"/>
                        <circle cx="225" cy="119" r="2.5" fill="var(--hel-color-background)"/>

                        <!-- Strobe Beacon -->
                        <circle class="strobe-beacon" cx="295" cy="22" r="3" fill="var(--hel-color-secondary)"/>

                        <!-- Rotor Mast -->
                        <rect x="162" y="24" width="5" height="20" fill="var(--hel-color-primary)"/>

                        <!-- Observable Main Rotor Blades -->
                        <g transform="translate(164, 22) scale(1, 0.22)">
                            <g class="main-blade-spin">
                                <line x1="-125" y1="0" x2="125" y2="0" stroke="var(--hel-color-background)" stroke-width="5.5" stroke-linecap="round"/>
                                <line x1="0" y1="-125" x2="0" y2="125" stroke="var(--hel-color-background)" stroke-width="5.5" stroke-linecap="round"/>
                                <line x1="-125" y1="0" x2="-105" y2="0" stroke="var(--hel-color-secondary)" stroke-width="5.5"/>
                                <line x1="105" y1="0" x2="125" y2="0" stroke="var(--hel-color-secondary)" stroke-width="5.5"/>
                                <line x1="0" y1="-125" x2="0" y2="-105" stroke="var(--hel-color-secondary)" stroke-width="5.5"/>
                                <line x1="0" y1="105" x2="0" y2="125" stroke="var(--hel-color-secondary)" stroke-width="5.5"/>
                            </g>
                            <circle cx="0" cy="0" r="12" fill="var(--hel-color-primary)"/>
                            <circle cx="0" cy="0" r="5" fill="var(--hel-color-foreground)"/>
                        </g>
                    </svg>
                </section>

                <!-- 2. LADDER STYLE -->
                <style>
                    .ladder-section {
                        width: 320px;
                        height: 44px;
                        position: relative;
                        display: block;
                        margin: 0;
                        padding: 0;
                        line-height: 0;
                        z-index: 5;
                    }

                    .ladder-section .ladder-svg {
                        width: 320px;
                        height: 44px;
                        display: block;
                    }
                </style>

                <!-- 2. LADDER SECTION -->
                <section class="ladder-section">
                    <svg class="ladder-svg" viewBox="0 0 320 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="116" y="0" width="8" height="5" rx="1" fill="var(--hel-color-background)" stroke="var(--hel-color-secondary)" stroke-width="1"/>
                        <rect x="196" y="0" width="8" height="5" rx="1" fill="var(--hel-color-background)" stroke="var(--hel-color-secondary)" stroke-width="1"/>

                        <line x1="120" y1="2" x2="120" y2="40" stroke="var(--hel-color-background)" stroke-width="2.8"/>
                        <line x1="120" y1="2" x2="120" y2="40" stroke="var(--hel-color-secondary)" stroke-width="1.2" stroke-dasharray="4,2"/>

                        <line x1="200" y1="2" x2="200" y2="40" stroke="var(--hel-color-background)" stroke-width="2.8"/>
                        <line x1="200" y1="2" x2="200" y2="40" stroke="var(--hel-color-secondary)" stroke-width="1.2" stroke-dasharray="4,2"/>

                        <g stroke-linecap="round">
                            <line x1="116" y1="14" x2="204" y2="14" stroke="var(--hel-color-background)" stroke-width="3"/>
                            <line x1="118" y1="14" x2="202" y2="14" stroke="var(--hel-color-secondary)" stroke-width="1.6"/>

                            <line x1="116" y1="26" x2="204" y2="26" stroke="var(--hel-color-background)" stroke-width="3"/>
                            <line x1="118" y1="26" x2="202" y2="26" stroke="var(--hel-color-secondary)" stroke-width="1.6"/>
                        </g>

                        <circle cx="120" cy="40" r="3.5" fill="none" stroke="var(--hel-color-background)" stroke-width="2"/>
                        <circle cx="120" cy="40" r="1.5" fill="var(--hel-color-secondary)"/>

                        <circle cx="200" cy="40" r="3.5" fill="none" stroke="var(--hel-color-background)" stroke-width="2"/>
                        <circle cx="200" cy="40" r="1.5" fill="var(--hel-color-secondary)"/>
                    </svg>
                </section>

                <!-- 3. FORM STYLE (WITH SINE-WAVE DIFFORMITY) -->
                <style>
                    .form-section {
                        width: 320px;
                        position: relative;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        margin-top: -1px;
                        z-index: 6;
                    }

                    .form-section .hanger-beam {
                        width: 280px;
                        height: 8px;
                        background: linear-gradient(180deg, var(--hel-color-muted) 0%, var(--hel-color-primary) 100%);
                        border-radius: 4px;
                        position: relative;
                        z-index: 5;
                        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
                    }

                    .form-section .beam-cap {
                        position: absolute;
                        top: -2px;
                        width: 12px;
                        height: 12px;
                        background: var(--hel-color-secondary);
                        border-radius: 50%;
                        border: 2px solid var(--hel-color-background);
                        transform: translateX(-50%);
                    }
                    .form-section .beam-cap-left  { left: 100px; }
                    .form-section .beam-cap-right { left: 180px; }

                    /* Unrolling Keyframes */
                    @keyframes unrollCanvasSheet {
                        0%   { clip-path: inset(0 0 100% 0); opacity: 0.9; }
                        85%  { clip-path: inset(0 0 -6px 0); }
                        100% { clip-path: inset(0 0 0% 0); opacity: 1; }
                    }

                    @keyframes unrollBottomRod {
                        0%   { transform: translateY(0px); }
                        85%  { transform: translateY(280px); }
                        100% { transform: translateY(275px); }
                    }

                    /* ================= 1. PHYSICAL SINE-WAVE DIFFORMITY KEYFRAMES ================= */
                    /* Fabric undulation driven by rotor downwash */
                    @keyframes sineWaveDeform {
                        0% {
                            transform: perspective(600px) rotateX(0deg) rotateY(0deg) skewX(0deg) skewY(0deg);
                        }
                        25% {
                            transform: perspective(600px) rotateX(1.8deg) rotateY(1.4deg) skewX(0.8deg) skewY(0.4deg);
                        }
                        50% {
                            transform: perspective(600px) rotateX(-1.2deg) rotateY(-1.6deg) skewX(-0.6deg) skewY(-0.3deg);
                        }
                        75% {
                            transform: perspective(600px) rotateX(1.4deg) rotateY(-0.8deg) skewX(0.5deg) skewY(-0.4deg);
                        }
                        100% {
                            transform: perspective(600px) rotateX(0deg) rotateY(0deg) skewX(0deg) skewY(0deg);
                        }
                    }

                    /* Traveling sine-wave shading (peaks and troughs on canvas surface) */
                    @keyframes sineWaveClothSheen {
                        0% {
                            background-position: 0% 0%;
                        }
                        50% {
                            background-position: 100% 80%;
                        }
                        100% {
                            background-position: 0% 0%;
                        }
                    }

                    /* Oscillating telemetry sine-wave stroke animation */
                    @keyframes sineWaveSignalFlow {
                        0% {
                            stroke-dashoffset: 0;
                        }
                        100% {
                            stroke-dashoffset: -120;
                        }
                    }

                    /* Canvas Card Container */
                    .form-section .canvas-card {
                        width: 270px;
                        height: 275px;
                        box-sizing: border-box;
                        background: var(--hel-color-canvas);
                        border: 2px solid var(--hel-color-primary);
                        border-top: none;
                        padding: 14px 16px 12px;
                        box-shadow: 0 15px 30px rgba(15, 23, 42, 0.2);
                        position: relative;
                        z-index: 2;
                        clip-path: inset(0 0 100% 0);
                        overflow: hidden;
                    }

                    /* Dedicated Wrapper Carrying the 3D Sine-Wave Deformity */
                    .form-section .canvas-deform-wrap {
                        width: 100%;
                        height: 100%;
                        display: flex;
                        flex-direction: column;
                        justify-content: flex-start;
                        transform-origin: top center;
                        animation: sineWaveDeform var(--hel-sine-wave-speed) ease-in-out infinite;
                    }

                    /* 3D Fabric Sine-Wave Sheen Overlay */
                    .form-section .sine-wave-cloth-overlay {
                        position: absolute;
                        inset: 0;
                        pointer-events: none;
                        background: repeating-linear-gradient(
                            145deg,
                            transparent 0%,
                            rgba(255, 255, 255, 0.35) 12%,
                            transparent 25%,
                            rgba(15, 23, 42, 0.04) 38%,
                            transparent 50%
                        );
                        background-size: 200% 200%;
                        animation: sineWaveClothSheen calc(var(--hel-sine-wave-speed) * 1.5) ease-in-out infinite;
                        mix-blend-mode: multiply;
                        z-index: 1;
                    }

                    /* Live Sine-Wave Graphic Watermark (Inside form background) */
                    .form-section .sine-wave-bg {
                        position: absolute;
                        top: 25px;
                        left: 0;
                        width: 100%;
                        height: 90px;
                        pointer-events: none;
                        opacity: 0.18;
                        z-index: 0;
                    }

                    .form-section .sine-wave-path {
                        stroke: var(--hel-color-foreground);
                        stroke-width: 1.6;
                        fill: none;
                        stroke-dasharray: 8, 4;
                        animation: sineWaveSignalFlow calc(var(--hel-sine-wave-speed) * 1.2) linear infinite;
                    }

                    .form-section .login-inputs-wrapper {
                        width: 100%;
                        box-sizing: border-box;
                        position: relative;
                        z-index: 3;
                    }

                    .form-section .roller-rod {
                        width: 280px;
                        height: 10px;
                        background: linear-gradient(180deg, var(--hel-color-muted) 0%, var(--hel-color-background) 100%);
                        border-radius: 5px;
                        position: absolute;
                        top: -2px;
                        z-index: 4;
                        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35);
                        transform: translateY(0px);
                    }

                    #state-flyin:checked ~ .stage-viewport .canvas-card {
                        animation: unrollCanvasSheet calc(1.2s / var(--hel-speed)) cubic-bezier(0.35, 0.05, 0.2, 1) calc(2.6s / var(--hel-speed)) forwards;
                    }
                    #state-flyin:checked ~ .stage-viewport .roller-rod {
                        animation: unrollBottomRod calc(1.2s / var(--hel-speed)) cubic-bezier(0.35, 0.05, 0.2, 1) calc(2.6s / var(--hel-speed)) forwards;
                    }

                    #state-success:checked ~ .stage-viewport .canvas-card,
                    #state-fail:checked ~ .stage-viewport .canvas-card {
                        clip-path: inset(0 0 0% 0);
                    }
                    #state-success:checked ~ .stage-viewport .roller-rod,
                    #state-fail:checked ~ .stage-viewport .roller-rod {
                        transform: translateY(275px);
                    }

                    .form-section .roller-rod::before,
                    .form-section .roller-rod::after {
                        content: '';
                        position: absolute;
                        top: -2px;
                        width: 14px;
                        height: 14px;
                        background: var(--hel-color-secondary);
                        border: 2px solid var(--hel-color-background);
                        border-radius: 50%;
                    }
                    .form-section .roller-rod::before { left: -4px; }
                    .form-section .roller-rod::after  { right: -4px; }

                    .form-section .form-header {
                        text-align: center;
                        margin-bottom: 8px;
                        width: 100%;
                        position: relative;
                        z-index: 3;
                    }
                    .form-section .badge {
                        display: inline-block;
                        font-size: 8.5px;
                        font-weight: 800;
                        letter-spacing: 1.2px;
                        color: var(--hel-color-foreground);
                        background: var(--hel-sky-bot);
                        padding: 2px 8px;
                        border-radius: 10px;
                        margin-bottom: 3px;
                    }
                    .form-section .form-title {
                        font-size: 16px;
                        font-weight: 900;
                        color: var(--hel-color-text);
                        letter-spacing: 0.5px;
                        line-height: 1.2;
                    }

                    .form-section .input-group {
                        width: 100%;
                        box-sizing: border-box;
                        margin-bottom: 7px;
                        display: flex;
                        flex-direction: column;
                        gap: 2px;
                    }
                    .form-section .input-group label {
                        font-size: 9.5px;
                        font-weight: 700;
                        color: var(--hel-color-muted);
                        text-transform: uppercase;
                    }

                    .form-section .input-group input {
                        display: block;
                        width: 100%;
                        max-width: 100%;
                        box-sizing: border-box;
                        margin: 0;
                        padding: 6px 9px;
                        border: 1.5px solid var(--hel-color-border);
                        border-radius: 5px;
                        font-size: 13px;
                        line-height: 1.3;
                        color: var(--hel-color-text);
                        outline: none;
                        appearance: none;
                        background: rgba(255, 255, 255, 0.9);
                    }
                    .form-section .input-group input:focus {
                        border-color: var(--hel-color-foreground);
                        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
                    }

                    .form-section .btn-stack {
                        width: 100%;
                        box-sizing: border-box;
                        display: flex;
                        flex-direction: column;
                        gap: 6px;
                        margin-top: 8px;
                        position: relative;
                        z-index: 3;
                    }
                    .form-section .action-label-btn {
                        display: block;
                        width: 100%;
                        max-width: 100%;
                        box-sizing: border-box;
                        margin: 0;
                        text-align: center;
                        padding: 7.5px;
                        font-size: 10.5px;
                        font-weight: 800;
                        text-transform: uppercase;
                        letter-spacing: 0.8px;
                        border-radius: 5px;
                        cursor: pointer;
                        transition: all 0.2s ease;
                        user-select: none;
                    }
                    .form-section .btn-login {
                        background: var(--hel-color-foreground);
                        color: var(--hel-color-primary);
                        box-shadow: 0 3px 8px rgba(56, 189, 248, 0.35);
                    }
                    .form-section .btn-login:hover { filter: brightness(1.08); }
                    .form-section .btn-fail {
                        background: var(--hel-color-danger-bg);
                        color: var(--hel-color-danger);
                        border: 1px dashed var(--hel-color-danger-border);
                        font-size: 9.5px;
                        padding: 6.5px;
                    }

                    #state-success:checked ~ .stage-viewport .canvas-card {
                        border-color: var(--hel-color-success);
                        box-shadow: 0 0 20px var(--hel-color-success);
                    }
                    #state-fail:checked ~ .stage-viewport .canvas-card {
                        border-color: var(--hel-color-danger);
                        box-shadow: 0 0 20px var(--hel-color-danger);
                    }
                </style>

                <!-- 3. FORM SECTION -->
                <section class="form-section">
                    <div class="hanger-beam">
                        <div class="beam-cap beam-cap-left"></div>
                        <div class="beam-cap beam-cap-right"></div>
                    </div>

                    <div class="canvas-card">
                        <!-- 3D Sine-Wave Crease Ripple Overlay -->
                        <div class="sine-wave-cloth-overlay"></div>

                        <!-- Live Telemetry Sine-Wave Watermark Grid -->
                        <svg class="sine-wave-bg" viewBox="0 0 270 90" fill="none" preserveAspectRatio="none">
                            <!-- Primary Mathematical Sine Wave Waveform -->
                            <path class="sine-wave-path" d="M 0,45 Q 33.75,15 67.5,45 T 135,45 T 202.5,45 T 270,45" />
                            <!-- Harmonic Secondary Sine Wave -->
                            <path class="sine-wave-path" style="opacity: 0.5; stroke-dashoffset: 40;" d="M 0,45 Q 33.75,70 67.5,45 T 135,45 T 202.5,45 T 270,45" />
                        </svg>

                        <!-- Wrapper that applies the 3D Sine-Wave Flutter Deformation -->
                        <div class="canvas-deform-wrap">
                            <div class="form-header">
                                <span class="badge">SECURE AIR-LINK</span>
                                <h2 class="form-title">PILOT LOGIN</h2>
                            </div>

                            <div class="login-inputs-wrapper">
                                <div class="input-group">
                                    <label for="username">Callsign</label>
                                    <input type="text" id="username" placeholder="e.g. Maverick" autocomplete="off" value="Alpha-1">
                                </div>

                                <div class="input-group">
                                    <label for="password">Security Code</label>
                                    <input type="password" id="password" placeholder="••••••••" value="12345678">
                                </div>

                                <div class="btn-stack">
                                    <label for="state-success" class="action-label-btn btn-login">
                                        Authenticate & Depart
                                    </label>
                                    <label for="state-fail" class="action-label-btn btn-fail">
                                        Simulate Wrong Password
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="roller-rod"></div>
                </section>

            </div>
        </div>
    </div>

</body>
</html>
