<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helicopter Login Form</title>
    <style>
        /* ================= BASE STYLING ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 60%, #e0f2fe 100%);
            overflow: hidden;
            position: relative;
        }

        /* Ambient Cloud Background */
        .sky-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50px;
            filter: blur(8px);
        }
        .cloud-1 { width: 340px; height: 90px; top: 12%; left: 8%; opacity: 0.8; }
        .cloud-2 { width: 480px; height: 110px; top: 38%; right: -5%; opacity: 0.6; }
        .cloud-3 { width: 280px; height: 80px; bottom: 15%; left: 15%; opacity: 0.7; }

        /* ================= STATE CONTROLLER (Pure HTML/CSS) ================= */
        input[type="radio"].state-toggle {
            display: none;
        }

        /* Floating Mission Control Bar */
        .demo-bar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 999px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            z-index: 9999;
        }
        .demo-btn {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            color: #94a3b8;
        }
        .demo-btn:hover { color: #f8fafc; }
        #state-flyin:checked ~ .demo-bar label[for="state-flyin"],
        #state-success:checked ~ .demo-bar label[for="state-success"],
        #state-fail:checked ~ .demo-bar label[for="state-fail"] {
            background: #0284c7;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
        }
        #state-fail:checked ~ .demo-bar label[for="state-fail"] {
            background: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
        }
        #state-success:checked ~ .demo-bar label[for="state-success"] {
            background: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        }

        /* ================= FLIGHT KEYFRAME ANIMATIONS ================= */
        /* 1. Fly-in from 2x viewport right to center */
        @keyframes flyInFromRight {
            0% {
                transform: translate(150vw, -30px) rotate(-10deg);
            }
            65% {
                transform: translate(-25px, 15px) rotate(6deg); /* Flare / Airbrake */
            }
            85% {
                transform: translate(8px, -6px) rotate(-2deg);
            }
            100% {
                transform: translate(0, 0) rotate(0deg); /* Settled at center */
            }
        }

        /* 2. Success: Pitch down, throttle up, fly off to left (-150vw) */
        @keyframes flyOutToLeft {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            20% {
                transform: translate(25px, -15px) rotate(4deg); /* Gather lift */
            }
            100% {
                transform: translate(-160vw, -70px) rotate(-16deg); /* Fast exit left */
            }
        }

        /* 3. Fail: Engine stall, uncontrolled spiral crash downwards */
        @keyframes chopperCrash {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            15% {
                transform: translate(10px, -20px) rotate(-18deg); /* Stall jerk */
            }
            30% {
                transform: translate(-25px, 40px) rotate(65deg);
            }
            60% {
                transform: translate(30px, 180px) rotate(260deg);
            }
            85% {
                transform: translate(-20px, 420px) rotate(520deg);
            }
            100% {
                transform: translate(15px, 120vh) rotate(780deg);
            }
        }

        /* Hovering vibration while at station */
        @keyframes hoverSway {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50%      { transform: translateY(-7px) rotate(-0.5deg); }
        }

        /* Rotors */
        @keyframes spinFast {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* Unrolling Canvas Animation (Runs once after chopper arrives) */
        @keyframes unrollCanvasSheet {
            0% {
                clip-path: inset(0 0 100% 0);
                opacity: 0.9;
            }
            85% {
                clip-path: inset(0 0 -6px 0); /* Bounce slightly past */
            }
            100% {
                clip-path: inset(0 0 0% 0);
                opacity: 1;
            }
        }

        @keyframes unrollBottomRod {
            0% {
                transform: translateY(0px);
            }
            85% {
                transform: translateY(326px); /* Bounce */
            }
            100% {
                transform: translateY(320px);
            }
        }

        /* Smoke puffs on crash */
        @keyframes billowSmoke {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.3);
            }
            50% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translate(-60px, -120px) scale(3.5);
            }
        }

        /* ================= HELICOPTER & STAGE SETUP ================= */
        .flight-stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* The overall master rig that carries chopper + hanging login card */
        .helo-rig {
            position: absolute;
            top: calc(50% - 280px);
            left: calc(50% - 170px);
            width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: center center;
            z-index: 50;

            /* Default entrance: Flies in from right */
            animation: flyInFromRight 2.8s cubic-bezier(0.25, 0.9, 0.3, 1) forwards;
        }

        /* Apply hover once arrived */
        .helo-body-hover {
            animation: hoverSway 3s ease-in-out infinite 2.8s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Scaled Helicopter SVG (Compact & Crisp) */
        .chopper-svg-box {
            width: 320px;
            height: 180px;
            overflow: visible;
        }

        .main-blade {
            animation: spinFast 0.05s linear infinite;
            transform-box: fill-box;
            transform-origin: center;
        }
        .tail-blade {
            animation: spinFast 0.035s linear infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        /* Crash Smoke Plume Generator (Hidden until crash) */
        .smoke-puff {
            position: absolute;
            top: 60px;
            left: 170px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle, #475569 0%, rgba(30,41,59,0) 80%);
            opacity: 0;
            pointer-events: none;
        }

        /* ================= HANGING BILLBOARD / LOGIN CANVAS ================= */
        .billboard-assembly {
            position: relative;
            width: 310px;
            margin-top: -6px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hanging Webbing Ropes */
        .rig-ropes {
            width: 100%;
            height: 48px;
            position: relative;
        }
        .rig-rope {
            position: absolute;
            top: -6px;
            width: 2.5px;
            height: 52px;
            background: repeating-linear-gradient(180deg, #090d16 0px, #090d16 4px, #f59e0b 4px, #f59e0b 7px);
            border-radius: 2px;
        }
        .rope-left { left: 96px; }
        .rope-right { right: 96px; }

        /* Metallic Top Hanger Beam */
        .hanger-beam {
            width: 300px;
            height: 8px;
            background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
            border-radius: 4px;
            position: relative;
            z-index: 5;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.25);
        }
        .beam-cap {
            position: absolute;
            top: -2px;
            width: 12px;
            height: 12px;
            background: #f59e0b;
            border-radius: 50%;
            border: 2px solid #0f172a;
        }
        .beam-cap-left { left: 88px; }
        .beam-cap-right { right: 88px; }

        /* THE UNROLLING CANVAS SHEET */
        .canvas-card {
            width: 290px;
            background: #ffffff;
            border: 2px solid #1e293b;
            border-top: none;
            border-radius: 0 0 6px 6px;
            padding: 22px 20px 24px;
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.2);
            position: relative;
            z-index: 2;

            /* Unrolling setup: Triggered right after fly-in */
            clip-path: inset(0 0 100% 0);
            animation: unrollCanvasSheet 1.2s cubic-bezier(0.35, 0.05, 0.2, 1) 2.6s forwards;
        }

        /* Heavy Weighted Bottom Roller Tube */
        .roller-rod {
            width: 298px;
            height: 10px;
            background: linear-gradient(180deg, #64748b 0%, #0f172a 100%);
            border-radius: 5px;
            position: absolute;
            top: 48px;
            z-index: 4;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);

            /* Follows the bottom of the unrolling canvas */
            animation: unrollBottomRod 1.2s cubic-bezier(0.35, 0.05, 0.2, 1) 2.6s forwards;
        }
        .roller-rod::before,
        .roller-rod::after {
            content: '';
            position: absolute;
            top: -2px;
            width: 14px;
            height: 14px;
            background: #f59e0b;
            border: 2px solid #0f172a;
            border-radius: 50%;
        }
        .roller-rod::before { left: -4px; }
        .roller-rod::after  { right: -4px; }

        /* ================= LOGIN FORM ELEMENTS ================= */
        .form-header {
            text-align: center;
            margin-bottom: 16px;
        }
        .badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #0284c7;
            background: #e0f2fe;
            padding: 3px 8px;
            border-radius: 12px;
            margin-bottom: 6px;
        }
        .form-title {
            font-size: 19px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .input-group label {
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-group input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        /* Action Buttons */
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 14px;
        }
        .action-label-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .btn-login {
            background: #0284c7;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
        }
        .btn-login:hover {
            background: #0369a1;
            transform: translateY(-1px);
        }
        .btn-fail {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px dashed #f87171;
            font-size: 10.5px;
        }
        .btn-fail:hover {
            background: #fecaca;
        }

        /* ================= STATE SWITCH TRIGGERS ================= */

        /* SUCCESS STATE: Fly away to left (-150vw) */
        #state-success:checked ~ .flight-stage .helo-rig {
            animation: flyOutToLeft 2.2s cubic-bezier(0.55, 0.05, 0.3, 1) forwards !important;
        }
        #state-success:checked ~ .flight-stage .canvas-card {
            border-color: #10b981;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
        }
        #state-success:checked ~ .flight-stage .badge {
            background: #dcfce7;
            color: #15803d;
        }

        /* FAILED STATE: Crash down & billow smoke */
        #state-fail:checked ~ .flight-stage .helo-rig {
            animation: chopperCrash 2.8s cubic-bezier(0.35, 0, 0.65, 1) forwards !important;
        }
        #state-fail:checked ~ .flight-stage .main-blade {
            animation-duration: 0.18s; /* Slow stutter */
        }
        #state-fail:checked ~ .flight-stage .strobe-beacon {
            fill: #ef4444 !important;
            filter: drop-shadow(0 0 8px #ef4444);
        }
        #state-fail:checked ~ .flight-stage .smoke-1 {
            animation: billowSmoke 0.9s ease-out infinite;
        }
        #state-fail:checked ~ .flight-stage .smoke-2 {
            animation: billowSmoke 0.9s ease-out infinite 0.3s;
        }
        #state-fail:checked ~ .flight-stage .smoke-3 {
            animation: billowSmoke 0.9s ease-out infinite 0.6s;
        }
        #state-fail:checked ~ .flight-stage .canvas-card {
            border-color: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
        }
        #state-fail:checked ~ .flight-stage .badge {
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>
<body>

    <!-- Pure CSS State Radios -->
    <input type="radio" name="sim-state" id="state-flyin" class="state-toggle" checked>
    <input type="radio" name="sim-state" id="state-success" class="state-toggle">
    <input type="radio" name="sim-state" id="state-fail" class="state-toggle">

    <!-- Top Mission Controller (Direct Testing Bar) -->
    <div class="demo-bar">
        <label for="state-flyin" class="demo-btn">🔄 Reset / Fly-In</label>
        <label for="state-success" class="demo-btn">✅ Test Success (Fly Left)</label>
        <label for="state-fail" class="demo-btn">💥 Test Fail (Crash)</label>
    </div>

    <!-- Background Clouds -->
    <div class="sky-bg">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <!-- Main Viewport Arena -->
    <main class="flight-stage">
        
        <!-- The Floating Helicopter + Rig Unit -->
        <div class="helo-rig">
            <div class="helo-body-hover">

                <!-- Smoke Puffs (Active on crash) -->
                <div class="smoke-puff smoke-1"></div>
                <div class="smoke-puff smoke-2"></div>
                <div class="smoke-puff smoke-3"></div>

                <!-- Scaled Helicopter SVG -->
                <svg class="chopper-svg-box" viewBox="0 0 540 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="fuselage" x1="140" y1="110" x2="160" y2="230" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#1e293b" />
                            <stop offset="100%" stop-color="#090d16" />
                        </linearGradient>
                        <linearGradient id="windshield" x1="130" y1="130" x2="210" y2="200" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
                            <stop offset="100%" stop-color="#090d16" />
                        </linearGradient>
                    </defs>

                    <!-- Background Skid -->
                    <g opacity="0.65">
                        <path d="M190 205 L175 238" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
                        <path d="M255 200 L242 238" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
                        <path d="M135 232 Q145 238 160 238 L280 238" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
                    </g>

                    <!-- Tail Boom & Fin -->
                    <path d="M270 148 L440 120 L440 134 L265 178 Z" fill="#1e293b" stroke="#090d16" stroke-width="1.2"/>
                    <path d="M375 131 L412 135 L408 141 L372 136 Z" fill="#1e293b"/>
                    <path d="M430 132 L455 64 L472 64 L450 142 L433 140 Z" fill="#1e293b" stroke="#090d16" stroke-width="1.2"/>

                    <!-- Tail Rotor -->
                    <g transform="translate(460, 78) rotate(7) scale(0.28, 1)">
                        <circle cx="0" cy="0" r="32" fill="#090d16" opacity="0.2"/>
                        <g class="tail-blade">
                            <line x1="-32" y1="0" x2="32" y2="0" stroke="#090d16" stroke-width="3.5"/>
                            <line x1="0" y1="-32" x2="0" y2="32" stroke="#090d16" stroke-width="3.5"/>
                            <circle cx="-30" cy="0" r="2.5" fill="#f59e0b"/>
                            <circle cx="30" cy="0" r="2.5" fill="#f59e0b"/>
                        </g>
                        <circle cx="0" cy="0" r="4.5" fill="#38bdf8"/>
                    </g>

                    <!-- Fuselage Body -->
                    <path d="M118 178 C 112 155, 128 132, 160 124 C 190 116, 235 116, 275 130 C 285 134, 290 145, 280 172 C 270 198, 240 214, 185 214 C 140 214, 122 195, 118 178 Z" 
                          fill="url(#fuselage)" stroke="#090d16" stroke-width="1.8"/>

                    <!-- Engine Doghouse & Exhaust -->
                    <path d="M198 120 C205 106, 238 104, 268 116 C282 122, 286 130, 272 134 Z" fill="#1e293b"/>
                    <ellipse cx="270" cy="128" rx="5" ry="3.5" fill="#090d16" stroke="#f59e0b" stroke-width="1"/>

                    <!-- Clean Cockpit Glass -->
                    <path d="M123 174 C 118 156, 134 135, 162 128 C 192 122, 218 126, 226 142 C 232 155, 230 175, 212 186 C 190 196, 142 196, 126 186 C 123 183, 123 178, 123 174 Z" 
                          fill="url(#windshield)" stroke="#090d16" stroke-width="1.2"/>
                    <path d="M172 127 C174 150, 172 170, 168 194" stroke="#1e293b" stroke-width="2.5"/>

                    <!-- Foreground Skid -->
                    <path d="M168 206 L148 252" stroke="#1e293b" stroke-width="5.5" stroke-linecap="round"/>
                    <path d="M236 204 L216 252" stroke="#1e293b" stroke-width="5.5" stroke-linecap="round"/>
                    <path d="M106 242 Q 120 252, 138 252 L 264 252" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="106" cy="242" r="3" fill="#090d16"/>
                    <circle cx="264" cy="252" r="3" fill="#090d16"/>

                    <!-- Avionics Beacon -->
                    <circle class="strobe-beacon" cx="456" cy="62" r="3.5" fill="#f59e0b"/>

                    <!-- Rotor Mast -->
                    <rect x="223" y="82" width="7" height="28" fill="#1e293b"/>

                    <!-- Spinning Main Rotor Blades -->
                    <g transform="translate(226, 78) rotate(-3.5) scale(1, 0.22)">
                        <g class="main-blade">
                            <line x1="-192" y1="0" x2="192" y2="0" stroke="#090d16" stroke-width="5.5" stroke-linecap="round"/>
                            <line x1="0" y1="-192" x2="0" y2="192" stroke="#090d16" stroke-width="5.5" stroke-linecap="round"/>
                            <!-- Hi-Vis Tips -->
                            <line x1="-192" y1="0" x2="-168" y2="0" stroke="#f59e0b" stroke-width="5.5"/>
                            <line x1="168" y1="0" x2="192" y2="0" stroke="#f59e0b" stroke-width="5.5"/>
                            <line x1="0" y1="-192" x2="0" y2="-168" stroke="#f59e0b" stroke-width="5.5"/>
                            <line x1="0" y1="168" x2="0" y2="192" stroke="#f59e0b" stroke-width="5.5"/>
                        </g>
                        <circle cx="0" cy="0" r="16" fill="#1e293b"/>
                        <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
                    </g>
                </svg>

                <!-- ================= HANGING BILLBOARD WITH LOGIN FORM ================= -->
                <div class="billboard-assembly">
                    <!-- Twin Hanging Load Ropes -->
                    <div class="rig-ropes">
                        <div class="rig-rope rope-left"></div>
                        <div class="rig-rope rope-right"></div>
                    </div>

                    <!-- Top Structural Spreader Beam -->
                    <div class="hanger-beam">
                        <div class="beam-cap beam-cap-left"></div>
                        <div class="beam-cap beam-cap-right"></div>
                    </div>

                    <!-- The Revealed Canvas Login Sheet -->
                    <div class="canvas-card">
                        <div class="form-header">
                            <span class="badge">SECURE AIR-LINK</span>
                            <h2 class="form-title">PILOT LOGIN</h2>
                        </div>

                        <form onsubmit="return false;">
                            <div class="input-group">
                                <label for="username">Callsign</label>
                                <input type="text" id="username" placeholder="e.g. Maverick" autocomplete="off" value="Alpha-1">
                            </div>

                            <div class="input-group">
                                <label for="password">Security Code</label>
                                <input type="password" id="password" placeholder="••••••••" value="12345678">
                            </div>

                            <div class="btn-stack">
                                <!-- Triggers Success State (Flies away to Left) -->
                                <label for="state-success" class="action-label-btn btn-login">
                                    Authenticate & Depart
                                </label>

                                <!-- Triggers Fail State (Crashes) -->
                                <label for="state-fail" class="action-label-btn btn-fail">
                                    Simulate Wrong Password
                                </label>
                            </div>
                        </form>
                    </div>

                    <!-- Weighted Roller Rod (Unrolls down with the canvas) -->
                    <div class="roller-rod"></div>
                </div>

            </div>
        </div>

    </main>

</body>
</html>
