<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurable Animated Helicopter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
        }
    </style>
</head>
<body>

<!-- ================= HELICOPTER SECTION START ================= -->
<section class="helicopter-section">
    <style>
        /* --- GLOBAL ANIMATION KEYFRAMES --- */
        @keyframes chopperHover {
            0%   { transform: translateY(0px) rotate(0deg); }
            25%  { transform: translateY(-8px) rotate(-0.8deg); }
            50%  { transform: translateY(-3px) rotate(0.4deg); }
            75%  { transform: translateY(-11px) rotate(-0.4deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes spinClockwise {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @keyframes strobeFlash {
            0%, 90%, 94%, 100% { opacity: 0.2; }
            92%, 96% { opacity: 1; filter: drop-shadow(0 0 6px var(--hel-color-secondary)); }
        }

        @keyframes navPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; filter: drop-shadow(0 0 6px var(--hel-color-foreground)); }
        }

        /* Ladder swaying in rotor downwash & forward motion */
        @keyframes ladderSway {
            0%   { transform: rotate(1deg) skewX(0.5deg); }
            30%  { transform: rotate(-5deg) skewX(-3deg); }
            65%  { transform: rotate(3deg) skewX(2deg); }
            100% { transform: rotate(1deg) skewX(0.5deg); }
        }

        /* --- COMPONENT SCOPE & GLOBAL VARIABLE DECLARATIONS --- */
        .helicopter-section {
            /* 1. Global Setup Variables */
            --hel-position: relative;
            --hel-z-index: 10;
            --hel-scale: 1;
            --hel-speed: 1; /* 1 = 1x speed, 2 = 2x faster, 0.5 = 2x slower */

            /* 2. Global Palette Variables */
            --hel-color-primary: #1e293b;       /* Airframe & Fuselage Main */
            --hel-color-secondary: #f59e0b;     /* Accent Stripe, Blade Tips & Ladder Rungs */
            --hel-color-background: #090d16;    /* Dark Shadows, Blade Spars & Interior */
            --hel-color-foreground: #38bdf8;    /* Cockpit Glass, Highlights & Skids */

            /* Layout using variables */
            position: var(--hel-position);
            z-index: var(--hel-z-index);
            width: 100%;
            min-height: 460px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            overflow: hidden;

            .chopper-wrapper {
                position: var(--hel-position);
                z-index: var(--hel-z-index);
                width: 540px;
                height: 400px;
                display: flex;
                justify-content: center;
                align-items: center;
                transform: scale(var(--hel-scale));
                transform-origin: center center;
                transition: transform 0.3s ease;
            }

            /* Animations adjusted dynamically via --hel-speed */
            .chopper-airframe {
                animation: chopperHover calc(3.6s / var(--hel-speed)) ease-in-out infinite;
                transform-origin: 226px 160px;
            }

            .main-rotor-spin {
                animation: spinClockwise calc(0.055s / var(--hel-speed)) linear infinite;
                transform-box: fill-box;
                transform-origin: center;
            }

            .tail-rotor-spin {
                animation: spinClockwise calc(0.035s / var(--hel-speed)) linear infinite;
                transform-box: fill-box;
                transform-origin: center;
            }

            .strobe-beacon {
                animation: strobeFlash calc(1.4s / var(--hel-speed)) infinite;
            }

            .nav-light {
                animation: navPulse calc(2s / var(--hel-speed)) ease-in-out infinite;
            }

            .hanging-ladder {
                animation: ladderSway calc(2.4s / var(--hel-speed)) ease-in-out infinite;
                transform-origin: 206px 253px;
            }

            /* --- RESPONSIVE MEDIA BREAKPOINTS --- */
            @media (min-width: 1200px) {
                --hel-scale: 1.15;
                min-height: 500px;
            }

            @media (max-width: 1024px) {
                --hel-scale: 0.9;
                min-height: 410px;
            }

            @media (max-width: 768px) {
                --hel-scale: 0.75;
                min-height: 350px;
            }

            @media (max-width: 480px) {
                --hel-scale: 0.58;
                min-height: 290px;
            }
        }
    </style>

    <div class="chopper-wrapper">
        <svg width="540" height="400" viewBox="0 0 540 400" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <defs>
                <!-- Fuselage Gradient -->
                <linearGradient id="fuselageGrad" x1="140" y1="110" x2="160" y2="230" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="var(--hel-color-primary)" stop-opacity="0.8" />
                    <stop offset="40%" stop-color="var(--hel-color-primary)" />
                    <stop offset="85%" stop-color="var(--hel-color-background)" />
                    <stop offset="100%" stop-color="var(--hel-color-background)" />
                </linearGradient>

                <!-- Cockpit Windshield Gradient -->
                <linearGradient id="windshieldGrad" x1="130" y1="130" x2="210" y2="200" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="var(--hel-color-foreground)" stop-opacity="0.85" />
                    <stop offset="65%" stop-color="var(--hel-color-primary)" stop-opacity="0.7" />
                    <stop offset="100%" stop-color="var(--hel-color-background)" stop-opacity="0.95" />
                </linearGradient>

                <!-- Tail Gradient -->
                <linearGradient id="tailGrad" x1="280" y1="130" x2="440" y2="150" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="var(--hel-color-primary)" />
                    <stop offset="100%" stop-color="var(--hel-color-background)" />
                </linearGradient>

                <!-- Metal Skid Tubes Gradient -->
                <linearGradient id="metalSkid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--hel-color-foreground)" stop-opacity="0.9" />
                    <stop offset="40%" stop-color="var(--hel-color-primary)" />
                    <stop offset="100%" stop-color="var(--hel-color-background)" />
                </linearGradient>
            </defs>

            <!-- ================= HOVERING AIRFRAME ================= -->
            <g class="chopper-airframe">
                
                <!-- 1. Background Skid (Far Side) -->
                <g opacity="0.65">
                    <path d="M190 205 L175 238" stroke="var(--hel-color-primary)" stroke-width="4.5" stroke-linecap="round"/>
                    <path d="M255 200 L242 238" stroke="var(--hel-color-primary)" stroke-width="4.5" stroke-linecap="round"/>
                    <path d="M135 232 Q145 238 160 238 L280 238" stroke="var(--hel-color-primary)" stroke-width="5" stroke-linecap="round"/>
                </g>

                <!-- 2. Tail Boom & Stabilizers -->
                <path d="M270 148 L440 120 L440 134 L265 178 Z" fill="url(#tailGrad)" stroke="var(--hel-color-background)" stroke-width="1.2"/>
                <path d="M375 131 L412 135 L408 141 L372 136 Z" fill="var(--hel-color-primary)" stroke="var(--hel-color-background)" stroke-width="1"/>
                <path d="M410 126 L414 126 L410 145 L406 145 Z" fill="var(--hel-color-foreground)"/>

                <!-- Vertical Tail Fin -->
                <path d="M430 132 L455 64 L472 64 L450 142 L433 140 Z" fill="var(--hel-color-primary)" stroke="var(--hel-color-background)" stroke-width="1.2"/>
                <path d="M455 64 L472 64 L469 72 L453 72 Z" fill="var(--hel-color-foreground)" opacity="0.8"/>

                <!-- 3. Tail Rotor -->
                <g transform="translate(460, 78) rotate(7) scale(0.28, 1)">
                    <circle cx="0" cy="0" r="32" fill="var(--hel-color-background)" opacity="0.2"/>
                    <g class="tail-rotor-spin">
                        <line x1="-32" y1="0" x2="32" y2="0" stroke="var(--hel-color-background)" stroke-width="3" stroke-linecap="round"/>
                        <line x1="0" y1="-32" x2="0" y2="32" stroke="var(--hel-color-background)" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="-30" cy="0" r="2.2" fill="var(--hel-color-secondary)"/>
                        <circle cx="30" cy="0" r="2.2" fill="var(--hel-color-secondary)"/>
                        <circle cx="0" cy="-30" r="2.2" fill="var(--hel-color-secondary)"/>
                        <circle cx="0" cy="30" r="2.2" fill="var(--hel-color-secondary)"/>
                    </g>
                    <circle cx="0" cy="0" r="4.5" fill="var(--hel-color-foreground)"/>
                </g>

                <!-- 4. Fuselage Pod & Engine Doghouse -->
                <path d="M118 178 C 112 155, 128 132, 160 124 C 190 116, 235 116, 275 130 C 285 134, 290 145, 280 172 C 270 198, 240 214, 185 214 C 140 214, 122 195, 118 178 Z" 
                      fill="url(#fuselageGrad)" stroke="var(--hel-color-background)" stroke-width="1.8"/>

                <path d="M198 120 C205 106, 238 104, 268 116 C282 122, 286 130, 272 134 Z" 
                      fill="var(--hel-color-primary)" stroke="var(--hel-color-background)" stroke-width="1.2"/>

                <!-- Turbine Exhaust -->
                <ellipse cx="270" cy="128" rx="5.5" ry="4" fill="var(--hel-color-background)" stroke="var(--hel-color-foreground)" stroke-width="1"/>
                <ellipse cx="270" cy="128" rx="3.5" ry="2.5" fill="var(--hel-color-secondary)" opacity="0.8"/>

                <!-- Cockpit Windshield -->
                <path d="M123 174 C 118 156, 134 135, 162 128 C 192 122, 218 126, 226 142 C 232 155, 230 175, 212 186 C 190 196, 142 196, 126 186 C 123 183, 123 178, 123 174 Z" 
                      fill="url(#windshieldGrad)" stroke="var(--hel-color-background)" stroke-width="1.2"/>

                <path d="M172 127 C174 150, 172 170, 168 194" stroke="var(--hel-color-primary)" stroke-width="2.5" stroke-linecap="round"/>
                
                <!-- Windshield Specular Gloss Sheen -->
                <path d="M132 170 C136 150, 150 138, 165 133" stroke="var(--hel-color-foreground)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <path d="M136 178 C145 186, 165 188, 185 186" stroke="var(--hel-color-foreground)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

                <!-- 5. Foreground Skid (Near Side) -->
                <path d="M168 206 L148 252" stroke="url(#metalSkid)" stroke-width="5.5" stroke-linecap="round"/>
                <path d="M236 204 L216 252" stroke="url(#metalSkid)" stroke-width="5.5" stroke-linecap="round"/>
                
                <circle cx="168" cy="207" r="3" fill="var(--hel-color-primary)"/>
                <circle cx="236" cy="205" r="3" fill="var(--hel-color-primary)"/>

                <path d="M106 242 Q 120 252, 138 252 L 264 252" stroke="url(#metalSkid)" stroke-width="6" stroke-linecap="round"/>
                <circle cx="106" cy="242" r="3" fill="var(--hel-color-background)"/>
                <circle cx="264" cy="252" r="3" fill="var(--hel-color-background)"/>

                <!-- 6. Hanging Rescue Ladder -->
                <g class="hanging-ladder">
                    <!-- Skid Clamps/Straps -->
                    <rect x="194.5" y="249" width="4.5" height="7" rx="1.5" fill="var(--hel-color-background)" stroke="var(--hel-color-primary)" stroke-width="0.8"/>
                    <rect x="213" y="249" width="4.5" height="7" rx="1.5" fill="var(--hel-color-background)" stroke="var(--hel-color-primary)" stroke-width="0.8"/>

                    <!-- Left & Right Support Webbing Ropes -->
                    <line x1="197" y1="254" x2="197" y2="384" stroke="var(--hel-color-background)" stroke-width="1.8" stroke-dasharray="3,1"/>
                    <line x1="215" y1="254" x2="215" y2="384" stroke="var(--hel-color-background)" stroke-width="1.8" stroke-dasharray="3,1"/>

                    <!-- Ladder Rungs (Accent Rescue Color) -->
                    <line x1="194" y1="270" x2="218" y2="270" stroke="var(--hel-color-secondary)" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="194" y1="288" x2="218" y2="288" stroke="var(--hel-color-secondary)" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="194" y1="306" x2="218" y2="306" stroke="var(--hel-color-secondary)" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="194" y1="324" x2="218" y2="324" stroke="var(--hel-color-secondary)" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="194" y1="342" x2="218" y2="342" stroke="var(--hel-color-secondary)" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="194" y1="360" x2="218" y2="360" stroke="var(--hel-color-secondary)" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="194" y1="378" x2="218" y2="378" stroke="var(--hel-color-secondary)" stroke-width="2.6" stroke-linecap="round"/>

                    <!-- Rung Rubber Caps -->
                    <circle cx="194" cy="270" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="218" cy="270" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="194" cy="288" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="218" cy="288" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="194" cy="306" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="218" cy="306" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="194" cy="324" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="218" cy="324" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="194" cy="342" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="218" cy="342" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="194" cy="360" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="218" cy="360" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="194" cy="378" r="1.3" fill="var(--hel-color-primary)"/>
                    <circle cx="218" cy="378" r="1.3" fill="var(--hel-color-primary)"/>

                    <!-- Weighted End Ring Knots -->
                    <circle cx="197" cy="384" r="2.2" fill="var(--hel-color-background)"/>
                    <circle cx="215" cy="384" r="2.2" fill="var(--hel-color-background)"/>
                </g>

                <!-- 7. Avionics & Lights -->
                <circle class="strobe-beacon" cx="456" cy="62" r="3.2" fill="var(--hel-color-secondary)"/>
                <circle class="nav-light" cx="218" cy="188" r="2.5" fill="var(--hel-color-foreground)"/>

                <!-- 8. Rotor Mast & Swashplate Assembly -->
                <rect x="223" y="82" width="7" height="28" fill="var(--hel-color-primary)" stroke="var(--hel-color-background)" stroke-width="1"/>
                <ellipse cx="226.5" cy="94" rx="9" ry="3" fill="var(--hel-color-foreground)" stroke="var(--hel-color-background)" stroke-width="1"/>
                <ellipse cx="226.5" cy="88" rx="7" ry="2.5" fill="var(--hel-color-foreground)"/>
                <line x1="221" y1="94" x2="223" y2="82" stroke="var(--hel-color-background)" stroke-width="1.5"/>
                <line x1="232" y1="94" x2="230" y2="82" stroke="var(--hel-color-background)" stroke-width="1.5"/>

                <!-- 9. Clean Main Rotor Blades -->
                <g transform="translate(226, 78) rotate(-3.5) scale(1, 0.22)">
                    <g class="main-rotor-spin">
                        <!-- Spars -->
                        <line x1="-192" y1="0" x2="192" y2="0" stroke="var(--hel-color-background)" stroke-width="5" stroke-linecap="round"/>
                        <line x1="0" y1="-192" x2="0" y2="192" stroke="var(--hel-color-background)" stroke-width="5" stroke-linecap="round"/>

                        <!-- Blade Airfoil Lines -->
                        <line x1="-190" y1="0" x2="-35" y2="0" stroke="var(--hel-color-primary)" stroke-width="3"/>
                        <line x1="35" y1="0" x2="190" y2="0" stroke="var(--hel-color-primary)" stroke-width="3"/>
                        <line x1="0" y1="-190" x2="0" y2="-35" stroke="var(--hel-color-primary)" stroke-width="3"/>
                        <line x1="0" y1="35" x2="0" y2="190" stroke="var(--hel-color-primary)" stroke-width="3"/>

                        <!-- High-Vis Warning Tips -->
                        <line x1="-192" y1="0" x2="-170" y2="0" stroke="var(--hel-color-secondary)" stroke-width="4.5"/>
                        <line x1="170" y1="0" x2="192" y2="0" stroke="var(--hel-color-secondary)" stroke-width="4.5"/>
                        <line x1="0" y1="-192" x2="0" y2="-170" stroke="var(--hel-color-secondary)" stroke-width="4.5"/>
                        <line x1="0" y1="170" x2="0" y2="192" stroke="var(--hel-color-secondary)" stroke-width="4.5"/>
                    </g>

                    <!-- Center Hub Dome -->
                    <circle cx="0" cy="0" r="16" fill="var(--hel-color-primary)" stroke="var(--hel-color-background)" stroke-width="2"/>
                    <circle cx="0" cy="0" r="7" fill="var(--hel-color-foreground)"/>
                    <circle cx="0" cy="0" r="3" fill="var(--hel-color-background)"/>
                </g>

            </g> <!-- Airframe End -->

        </svg>
    </div>
</section>
<!-- ================= HELICOPTER SECTION END ================= -->

</body>
</html>
