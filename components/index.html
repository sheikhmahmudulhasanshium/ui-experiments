    <title>Components | UI Ideas</title>
    <style>
        /* 1. FIXED: @import statements must be at the very top of your CSS */
        @import url('https://googleapis.com/css?family=Roboto:400,700&display=swap');
        @import url('https://googleapis.com/css?family=Pacifico:400&display=swap');

        /* 2. Global Themes & Layout */
        :root {
            --primary-color: #007BFF;
            --secondary-color: #6C757D;
            --background-color: #F8F9FA;
            --text-color: #212529;
        }

        html:has(#mode-state-input:checked) {
            --primary-color: #0D6EFD;
            --secondary-color: #ADB5BD;
            --background-color: #212529;
            --text-color: #F8F9FA;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 16px;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding-inline: 20px;
        }

        /* 3. Component Scoped Styles */
        .header-section {
            /* FIXED: Combined linear-gradient using 'background', added background-size */
            background: linear-gradient(
                90deg, 
                var(--primary-color) 25%, 
                color-mix(in srgb, var(--primary-color) 70%, var(--background-color)) 50%, 
                var(--primary-color) 75%
            );  
            background-size: 200% 100%;
            text-align: center;
            border-bottom: 1px solid var(--secondary-color);
            animation: shimmerMove 2s infinite linear;

            .container {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding-block: 10px;
            }

            .header-logo {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;

                .logo {
                    width: 44px;
                    height: 44px;
                    filter: brightness(0) invert(1);
                }
.logo-text {
                    display: flex;
                    flex-direction: column;
                    align-items: flex-start;
                    gap: 2px;
                    h1 {
                    font-size: 2rem;
                    margin: 0;
                    font-weight: 700;
                    font-family: 'Pacifico', cursive;
                    color: color-mix(in srgb, var(--background-color,#000) 50%, white);
                    }
                    small {
                        font-size: 12px;
                        font-weight: 400;
                        word-spacing: 1.2px;
                        letter-spacing: 1.5px;
                        line-height: 1.5px;
                        text-transform: uppercase;
                        color: var(--secondary-color);
                    }
                }
                   
            }

            .header-buttons {
                display: flex;
                align-items: center;
                gap: 10px;

                #mode-state-input {
                    display: none;
                }

                .btn, .mode-toggle-label {
                    background: none;
                    border: none;
                    cursor: pointer;
                    padding: 5px;
                    border-radius: 5px;
                    transition: background-color 0.3s ease;

                    &:hover {
                        background-color: rgba(255, 255, 255, 0.1);
                    }

                    img {
                        width: 24px;
                        height: 24px;
                        filter: brightness(0) invert(1);
                    }
                }

                .mode-toggle-label {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    user-select: none;

                    .sun-icon { display: block; }
                    .moon-icon { display: none; }
                }
            }
        }

        /* Swaps the state icons natively depending on the checked state */
        html:has(#mode-state-input:checked) .mode-toggle-label {
            .sun-icon { display: none; }
            .moon-icon { display: block; }
        }

        /* Generic Layout Section Padding */
        section {
            padding-block: 40px;
        }

        /* 4. FIXED: Moved keyframes outside of any classes to root level */
        @keyframes shimmerMove {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
    </style>
</head>
