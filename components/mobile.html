<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Component</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    /* ROOT MAIN CONTAINER */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh; /* Allows scrolling if screen is shorter than phone */
      min-width: 320px;  /* Prevents cutting off the side hardware buttons */
      padding: 20px;
      box-sizing: border-box;
    }

    /* MOBILE PHONE WRAPPER */
    .mobile-component {
      display: flex;
      flex-shrink: 0;    /* CRITICAL: Prevents flex container from squishing the phone */
      background-color: #000000;
      width: 280px;
      height: 560px;
      min-width: 280px;  /* Locks minimum width */
      min-height: 560px; /* Locks minimum height */
      border-radius: 36px;
      border: 4px solid color-mix(in srgb, rgb(217, 191, 219) 70%, rgb(255, 255, 255));
      padding: 24px 14px 14px 14px;
      box-sizing: border-box;
      position: relative;
    }

    /* PHYSICAL SIDE BUTTONS */
    .hardware-btn {
      position: absolute;
      background-color: #787c7c;
      border-radius: 4px 0 0 4px;
      width: 4px;
      left: -8px;
    }

    .vol-up { top: 100px; height: 40px; }
    .vol-down { top: 150px; height: 40px; }
    .power-btn { top: 120px; left: auto; right: -8px; border-radius: 0 4px 4px 0; height: 55px; }

    /* HARDWARE ON-FRAME COMPONENTS */
    .earpiece-speaker {
      width: 45px;
      height: 4px;
      background-color: #444444;
      border-radius: 2px;
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .camera-lens {
      width: 8px;
      height: 8px;
      background-color: #0d0d0d;
      border: 1px solid #333333;
      border-radius: 50%;
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: inset 0 0 2px #010314;
      z-index: 10;
    }

    /* INNER SCREEN AREA */
    .inner-screen {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background-color: #222222;
      border-radius: 20px;
      color: white;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }

    /* SYSTEM TOP STATUS BAR */
    .mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1a1a1a;
      height: 32px;
      flex-shrink: 0; /* Locks header height */
      width: 100%;
      padding: 0 16px;
      box-sizing: border-box;
      font-size: 12px;
      font-weight: bold;
      color: #bbbbbb;
      border-bottom: 1px solid #2d2d2d;
    }

    /* TELEMETRY ICON FLEX ALIGNMENT */
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* SCROLLABLE MAIN SCREEN CONTENT */
    .screen-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    /* FIXED STICKY MOBILE FOOTER */
    .mobile-footer {
      background-color: #eee8e8;
      width: 100%;
      height: 40px;
      flex-shrink: 0; /* Locks footer height */
      display: flex;
      align-items: center;
      box-sizing: border-box;
    }

    /* NAVIGATION ITEM CONTAINER */
    .mobile-footer ul {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* SPECIFIC FOOTER NAV ICON SIZES */
    .mobile-footer ul li img {
      width: 16px;
      height: 16px;
      display: block;
    }

    .tab-component, .pc-component {
      display: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="mobile-component">
      <!-- Physical Hardware Side Buttons -->
      <div class="hardware-btn vol-up"></div>
      <div class="hardware-btn vol-down"></div>
      <div class="hardware-btn power-btn"></div>

      <!-- Hardware Bezel Components -->
      <div class="earpiece-speaker"></div>
      <div class="camera-lens"></div>

      <div class="inner-screen">
        <!-- System Top Status Bar -->
        <div class="mobile-header">
          <span class="status-time">09:41</span>
          <div class="status-icons">

        </div>

        <!-- Scrollable Main Screen Content Area -->
        <div class="screen-content">

            <li><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGNsYXNzPSJsdWNpZGUgbHVjaWRlLWNpcmNsZSBwcmV2aWV3LWljb24iPjxjaXJjbGUgY3g9IjEyIiBjeT0iMTIiIHI9IjEwIi8+PC9zdmc+" alt="Menu"/></li>
            <li><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGNsYXNzPSJsdWNpZGUgbHVjaWRlLWNoZXZyb24tcmlnaHQgcHJldmlldy1pY29uIj48cGF0aCBkPSJtOSAxOCA2LTYtNi02Ii8+PC9zdmc+" alt="Profile"/></li>
          </ul>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
